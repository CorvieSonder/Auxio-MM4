name: Feature Request
description: Propose new functionality
labels: ["enhancement"]
assignees:
  - CorvieSonder
body:
  - type: markdown
    attributes:
      value: |
        Welcome to Auxio-MM4's feature request form.
        This is a fork of Auxio: please request features for this fork here, not on upstream Auxio's issue tracker. See the [Contribution Guidelines](https://github.com/CorvieSonder/Auxio-MM4/blob/fork/.github/CONTRIBUTING.md) for what is likely to be accepted.
  - type: textarea
    id: desc
    attributes:
      label: Description 
      description: Provide a clear and concise description of the feature to implement.
      placeholder: I want...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem solved
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
  - type: textarea
    id: others
    attributes:
      label: Other implementations
      description: How do other music players handle this? Please describe.
      placeholder: This music player does...
    validations:
      required: true 
  - type: textarea
    id: why
    attributes:
      label: Benefit
      description: >
        How will this addition benefit your or my usage of Auxio-MM4?
      placeholder: This feature allows...
    validations:
      required: true 
  - type: checkboxes
    id: terms
    attributes:
      label: Duplicates
      description: By submitting this issue, you aknowledge the following
      options:
        - label: I have checked this feature request for duplicates.
          required: true
        - label: I have checked that this feature is not implemented in the [latest version](https://github.com/CorvieSonder/Auxio-MM4/releases).
          required: true
        - label: I agree to the [Contribution Guidelines](https://github.com/CorvieSonder/Auxio-MM4/blob/fork/.github/CONTRIBUTING.md).
          required: true          
